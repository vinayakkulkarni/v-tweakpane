version: 2
updates:
  - package-ecosystem: npm
    versioning-strategy: increase
    directory: '/'
    # TypeScript 7 is held: vue-tsc 3.3.13 fails (ERR_PACKAGE_PATH_NOT_EXPORTED
    # './lib/tsc') and vp pack fails ("TypeScript 7.0 is not supported when
    # using Vue"). Remove this ignore when both support TypeScript 7.
    ignore:
      - dependency-name: typescript
        versions: ['>=7']
    schedule:
      interval: daily
      time: '00:00'
      timezone: Asia/Calcutta
    groups:
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-production:
        dependency-type: production
        update-types:
          - patch
    reviewers:
      - vinayakkulkarni
    assignees:
      - vinayakkulkarni
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: daily
      time: '00:00'
      timezone: Asia/Calcutta
    groups:
      actions-minor:
        update-types:
          - minor
          - patch
    reviewers:
      - vinayakkulkarni
    assignees:
      - vinayakkulkarni
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
